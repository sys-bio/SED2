# SED2 generator CI.
#
# Nothing generated is ever hand-edited (see Design.md's Code Generation
# section), so a generated/ directory that's out of sync with generator/ +
# specsheets/ (or test-specsheets/) is itself a bug. This workflow makes
# that impossible to leave unnoticed: on every run it deletes each
# generated/ directory, regenerates it fresh from source, and either
# (a) the regenerated output matches what's already committed - nothing to
#     do, proceed straight to testing it, or
# (b) it doesn't - on a direct push/workflow_dispatch, or on a pull_request
#     whose branch lives in this same repo, commit the fresh output right
#     back to that branch (self-healing: the tree in git can never drift
#     from what generator/ actually produces); on a pull_request from a
#     fork, fail the job instead (the token can't push to a fork), with a
#     diff explaining what to regenerate locally. Note for same-repo PRs:
#     the bot commit is made with GITHUB_TOKEN and so doesn't start a new
#     run; this run's downstream jobs test the regenerated output, but if
#     branch protection requires status checks, the new head commit will
#     have none - re-run CI or push again in that case. Pull the bot
#     commit before pushing more work to the branch.
#
# Determinism note: this scheme only stays a one-shot self-heal, never a
# commit-on-every-run loop, if the generator's output is byte-identical
# across repeated runs against unchanged input - no timestamps, UUIDs, PIDs,
# or hash-order-dependent set/dict iteration leaking into generated source.
# Verified by running the generator twice in a row and diffing the output
# trees (identical) plus an audit of generator/*.py for those patterns
# before this workflow was written; worth re-checking the same way if the
# generator ever grows a new source of that kind. Separately: the commit
# below is made with the default GITHUB_TOKEN, which GitHub deliberately
# does *not* treat as a workflow trigger - so this push does not start a
# second CI run (no PAT/deploy key is configured for that). That's fine
# here: the jobs that test the regenerated output are downstream (needs:)
# jobs in this *same* run, not a second triggered run, so testing still
# happens every time regardless of whether a commit was made. If a PAT is
# added later specifically to make the commit trigger a fresh run too, the
# determinism property above is what keeps that from looping: that second
# run would regenerate, find no diff (since it's the same input as the
# commit it's testing), and proceed straight to tests with nothing more to
# commit.
#
# SPECIFICATION.md (the single-file assembly of core-spec.md + specsheets/,
# built by tools/build_specification.py) is treated exactly like the
# generated/ trees: deleted first, regenerated fresh, and committed in the
# same single push only if it differs from what's already committed. The
# script's output is deterministic (no date or other run-dependent
# content), so this only ever commits when core-spec.md or specsheets/
# actually changed.
#
# Two regenerate targets, one job: test-specsheets/ -> test-specsheets/
# generated/ (Phase 1) and specsheets/ -> generated/ (Phase 2, all three
# targets). Both live in the *same* job, committed with a single
# `git add`/commit/push covering both trees, specifically so there's only
# ever one push per run - two independent jobs each pushing their own
# regeneration raced on the same ref and got a non-fast-forward rejection
# the first time this ran. A failure regenerating either tree fails the job,
# and with it every downstream test job. Every test job, for both trees and
# all three languages, is a real gate.
#
# Releases: after the main-spec test jobs pass, three release-* jobs package
# the generated libraries - release-python builds a wheel, release-java a jar
# (plus -sources and -javadoc jars and the pom), release-cpp a CMake source
# package (.tar.gz and .zip) - and smoke-test the packaged artifact itself
# (wheel installed into a clean virtualenv; jar contents checked; C++ package
# consumed through add_subdirectory()), then upload each as a workflow
# artifact (release-python / release-java / release-cpp) on every run. CI does
# not create or touch any GitHub release: to release, download the artifacts
# from a run's summary page and attach them to a release by hand, and to
# update a release, replace its files with the ones from a newer run. All
# three take their version from VERSION.txt at the repository root (via
# generator/generate.py, which stamps it into pyproject.toml, pom.xml and
# CMakeLists.txt), so the file names carry that version.
#
# JavaScript: generated/js is a fourth generated tree, compiled FROM the C++
# library with Emscripten (see generator/emit_js.py; the pattern is
# sys-bio/libantimonyjs). It is generated together with cpp - the same
# generate.py run, the same regenerate/self-heal commit - so it can't drift
# from the C++ it wraps. test-js-main builds it with emsdk and runs the same
# fixture suite under Node; release-js packs an npm tarball plus the
# single-file module. Only the real spec (specsheets/) gets a js tree: the
# synthetic test-specsheets/ tree stays python,java,cpp.

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TEST_SPEC_ROOT: test-specsheets
  TEST_GEN_OUT: test-specsheets/generated
  MAIN_SPEC_ROOT: specsheets
  MAIN_GEN_OUT: generated
  SPEC_FILE: SPECIFICATION.md
  # Emscripten SDK version used by the JavaScript jobs (installed from the
  # official emsdk repository; bump deliberately, like the ANTLR pin).
  EMSCRIPTEN_VERSION: "4.0.10"

jobs:
  # ---------------------------------------------------------------------
  # Regenerate both trees, commit once if either changed.
  # ---------------------------------------------------------------------

  regenerate:
    name: Regenerate generated/ directories (self-healing)
    runs-on: ubuntu-latest
    outputs:
      regen_main_outcome: ${{ steps.regen_main.outcome }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@main
        with:
          # On pull_request, github.ref_name is "<PR#>/merge" (not a branch),
          # so use the PR's head branch (and its repo, for fork PRs) there.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@main
        with:
          python-version: "3.11"

      # VERSION.txt is the library's version (not the SED2 document-format
      # version). generator/generate.py reads it by itself and stamps it into
      # all three libraries' build files; it is read here too so the release
      # jobs below can name and check their files.
      - name: Read library version from VERSION.txt
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          echo "Library version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The generator process itself (not just the libraries it writes)
      # imports these: emit_python.py's own leaf_value_ok() uses jsonschema
      # to pre-check schema-derivable fixtures at generate time, and
      # gen_fixtures.py verifies every candidate fixture by importing the
      # freshly-generated package in-process (sys.path, not pip install) and
      # calling its real validate() - which pulls in the generated
      # _runtime.py's own jsonschema import, and, for any is_math field,
      # math_ast.py's antlr4 import too. Versions match pyproject.toml's own
      # dependency list in emit_python.py (kept in sync there - see
      # Design.md's Toolchain section on why antlr4's version is pinned).
      - name: Install the generator's own runtime dependencies
        run: pip install "jsonschema>=4.18" "antlr4-python3-runtime==4.13.2"

      # -- test-specsheets/ -> test-specsheets/generated/  (Phase 1, proven) --
      # A failure here is a real regression - no continue-on-error, this is
      # allowed to fail the job.

      - name: Delete existing test-specsheets/generated, if any
        run: rm -rf "$TEST_GEN_OUT"

      - name: Regenerate from test-specsheets/ (all three targets)
        run: |
          python3 generator/generate.py \
            --spec-root "$TEST_SPEC_ROOT" \
            --out "$TEST_GEN_OUT" \
            --doc-class TestDocument \
            --base-mixin TestBase \
            --lang python,java,cpp

      # -- specsheets/ -> generated/  (Phase 2: all four targets, js being
      #    the C++ library compiled to WebAssembly) --
      # A failure here is a real regression and fails the job, like the
      # test-specsheets/ half.

      - name: Delete existing generated/, if any
        run: rm -rf "$MAIN_GEN_OUT"

      - name: Regenerate from specsheets/ (all three targets)
        id: regen_main
        run: |
          python3 generator/generate.py \
            --spec-root "$MAIN_SPEC_ROOT" \
            --out "$MAIN_GEN_OUT" \
            --doc-class SEDDocument \
            --base-mixin SEDBase \
            --lang python,java,cpp,js \
            --python-package libsed2 \
            --python-description "Generated SED2 library (Python target) - see Design.md's Code Generation section. GENERATED - do not hand-edit; regenerate via generator/generate.py." \
            --java-package org.sedml.libsed2 \
            --java-group-id org.sed-ml \
            --java-artifact-id libsed2j \
            --java-description "Generated SED2 library (Java target) - see Design.md's Code Generation section. GENERATED - do not hand-edit; regenerate via generator/generate.py." \
            --cpp-namespace libsed2 \
            --js-package libsed2js \
            --js-description "Generated SED2 library (JavaScript/WebAssembly target, the C++ library compiled with Emscripten) - see Design.md's Code Generation section. GENERATED - do not hand-edit; regenerate via generator/generate.py."

      # -- core-spec.md + specsheets/ -> SPECIFICATION.md --
      # Stdlib-only script, so no extra pip install. A failure here fails
      # the job, like the generator steps above.

      - name: Delete existing SPECIFICATION.md, if any
        run: rm -f "$SPEC_FILE"

      - name: Generate single-file SPECIFICATION.md
        run: python3 tools/build_specification.py --repo-root .

      # -- Commit all regenerated output together, one push --

      - name: Commit regenerated output if it changed
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git add -A -- "$TEST_GEN_OUT" "$MAIN_GEN_OUT" "$SPEC_FILE"
          if git diff --cached --quiet; then
            echo "No changes - generated output already matches the generator."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate generated directories and SPECIFICATION.md from spec"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Fail if this fork PR's committed output is stale
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git add -A -- "$TEST_GEN_OUT" "$MAIN_GEN_OUT" "$SPEC_FILE"
          if ! git diff --cached --quiet; then
            echo "::error::A generated/ directory or SPECIFICATION.md doesn't match what generator/ and tools/build_specification.py currently produce. Run them locally and commit the result." >&2
            git diff --cached --stat
            exit 1
          fi

      - name: Upload test-specsheets/generated for the test jobs
        uses: actions/upload-artifact@main
        with:
          name: test-specsheets-generated
          path: test-specsheets/generated
          retention-days: 7

      # generated/ (real spec) + fixtures/ (schema-derivable, written by the
      # regen step above via gen_fixtures.py) only exist to upload when
      # regen_main actually succeeded - guarded the same way the warning
      # step above is, so a Phase-2 regenerate failure just means the
      # downstream test-python-main job below has nothing to download and
      # skips (see that job's own `if:`), same graceful degradation as
      # everywhere else Phase 2 can still fail today.
      - name: Upload generated/ + fixtures/ for the real-spec test job
        if: steps.regen_main.outcome == 'success'
        uses: actions/upload-artifact@main
        with:
          name: main-generated
          path: |
            generated
            fixtures
          retention-days: 7

  # ---------------------------------------------------------------------
  # test-specsheets/ target tests - only depend on the test-specsheets/
  # half of the regenerate job above, so a Phase-2 (real spec) failure
  # there never blocks these.
  # ---------------------------------------------------------------------

  test-python:
    name: Python target (test-specsheets/)
    needs: regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.11"
      - name: Replace checked-out generated/ with this run's fresh copy
        run: rm -rf "$TEST_GEN_OUT"
      - uses: actions/download-artifact@main
        with:
          name: test-specsheets-generated
          path: test-specsheets/generated
      - name: Install libsed2test + test deps
        run: |
          pip install -e "$TEST_GEN_OUT/python"
          pip install pytest
      - name: Run fixture suite
        # test_fixtures.py is generator/emit_python.py's own copy of
        # templates/python/tests/test_fixtures.py (see
        # _copy_test_fixtures_py) - no manual copy step needed, and it
        # finds test-specsheets/fixtures/ (including its generated/
        # subdirectory) on its own without SED2_FIXTURES_DIR, since that's
        # the default relative to where it was copied.
        run: pytest "$TEST_GEN_OUT/python/test_fixtures.py" -q

  test-python-main:
    name: Python target (specsheets/)
    needs: regenerate
    # The real-spec regenerate step is a hard gate now (a failure there fails
    # the whole run); this guard only keeps the job from running when that
    # step did not succeed.
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.11"
      - name: Replace checked-out generated/ and fixtures/ with this run's fresh copies
        run: rm -rf "$MAIN_GEN_OUT" fixtures
      - uses: actions/download-artifact@main
        with:
          name: main-generated
          path: .
      - name: Install libsed2 + test deps
        run: |
          pip install -e "$MAIN_GEN_OUT/python"
          pip install pytest
      - name: Run fixture suite
        # Same test_fixtures.py as test-specsheets/ above, copied by the
        # generator into THIS tree's generated/python/ - it discovers
        # fixtures/generated/ (and fixtures/handwritten/, once Task 12's
        # deferred hand-authored fixtures exist - see Design.md's Testing
        # section) on its own, no per-spec configuration here.
        run: pytest "$MAIN_GEN_OUT/python/test_fixtures.py" -q

  test-java:
    name: Java target (test-specsheets/)
    needs: regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: "21"
      - name: Replace checked-out generated/ with this run's fresh copy
        run: rm -rf "$TEST_GEN_OUT"
      - uses: actions/download-artifact@main
        with:
          name: test-specsheets-generated
          path: test-specsheets/generated
      - name: Run fixture suite
        # FixtureTest.java is generator/emit_java.py's own copy of
        # templates/java/tests/FixtureTest.java (see
        # _copy_fixture_test_java) - no manual copy step needed. The
        # generated pom.xml also sets sed2.fixturesDir for us, so
        # SED2_FIXTURES_DIR isn't strictly required here either, but is
        # kept explicit for clarity/parity with the other targets.
        env:
          SED2_FIXTURES_DIR: ${{ github.workspace }}/test-specsheets/fixtures
        working-directory: ${{ github.workspace }}/test-specsheets/generated/java
        run: mvn -B test

  test-java-main:
    name: Java target (specsheets/)
    needs: regenerate
    # Same graceful-degradation shape as test-python-main: skip entirely
    # when the real-spec regenerate itself failed (nothing to test).
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: "21"
      - name: Replace checked-out generated/ and fixtures/ with this run's fresh copies
        run: rm -rf "$MAIN_GEN_OUT" fixtures
      - uses: actions/download-artifact@main
        with:
          name: main-generated
          path: .
      - name: Run fixture suite
        # Same as test-python-main: a real gate. The Java target implements
        # the same reference-resolution and handwritten-rule validation as
        # Python (verified document-for-document against Python's output).
        env:
          SED2_FIXTURES_DIR: ${{ github.workspace }}/fixtures
        working-directory: ${{ github.workspace }}/generated/java
        run: mvn -B test

  test-cpp:
    name: C++ target (test-specsheets/)
    needs: regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Replace checked-out generated/ with this run's fresh copy
        run: rm -rf "$TEST_GEN_OUT"
      - uses: actions/download-artifact@main
        with:
          name: test-specsheets-generated
          path: test-specsheets/generated
      # FixtureTest.cpp is generator/emit_cpp.py's own copy of
      # templates/cpp/tests/FixtureTest.cpp (see _copy_fixture_test_cpp) -
      # no manual copy step needed.
      - name: Configure (CMake + FetchContent for jsoncons/GoogleTest)
        working-directory: ${{ github.workspace }}/test-specsheets/generated/cpp
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: ${{ github.workspace }}/test-specsheets/generated/cpp
        run: cmake --build build -j"$(nproc)"
      - name: Run fixture suite
        # The generated CMakeLists.txt also bakes in a
        # SED2_FIXTURES_DIR_DEFAULT compile definition, so
        # SED2_FIXTURES_DIR isn't strictly required here either, but is
        # kept explicit for clarity/parity with the other targets.
        env:
          SED2_FIXTURES_DIR: ${{ github.workspace }}/test-specsheets/fixtures
        working-directory: ${{ github.workspace }}/test-specsheets/generated/cpp/build
        run: ./fixture_tests

  test-cpp-main:
    name: C++ target (specsheets/)
    needs: regenerate
    # Same graceful-degradation shape as test-python-main/test-java-main:
    # skip entirely when the real-spec regenerate itself failed.
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Replace checked-out generated/ and fixtures/ with this run's fresh copies
        run: rm -rf "$MAIN_GEN_OUT" fixtures
      - uses: actions/download-artifact@main
        with:
          name: main-generated
          path: .
      - name: Configure (CMake + FetchContent for jsoncons/GoogleTest)
        working-directory: ${{ github.workspace }}/generated/cpp
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: ${{ github.workspace }}/generated/cpp
        run: cmake --build build -j"$(nproc)"
      - name: Run fixture suite
        # Same as test-python-main: a real gate (see test-java-main).
        env:
          SED2_FIXTURES_DIR: ${{ github.workspace }}/fixtures
        working-directory: ${{ github.workspace }}/generated/cpp/build
        run: ./fixture_tests

  # ---------------------------------------------------------------------
  # specsheets/ -> generated/   (Phase 2, see Design.md)
  #
  # specsheets/ is the real, 51-class spec (doc-class SEDDocument, base
  # mixin SEDBase). All four targets' *-main jobs (test-python-main,
  # test-java-main, test-cpp-main - each placed next to its test-specsheets/
  # counterpart above - and test-js-main, the C++ library compiled with
  # Emscripten, which has no test-specsheets/ counterpart) run generated/<lang>'s own fixture suite against
  # fixtures/generated/ (schema-derivable, regenerated every run by
  # gen_fixtures.py) the same way the test-specsheets/ jobs do.
  # fixtures/handwritten/ (hand-authored semantic fixtures for the real
  # spec - Task 12's other half) is still deliberately deferred until the
  # spec itself stabilizes (see Design.md's Testing section); when it
  # exists, every *-main job picks its fixtures up automatically too -
  # nothing here is specific to fixtures/generated/ alone.
  #
  # All three targets are fully implemented against specsheets/ and gate
  # the run: a failing test-python-main, test-java-main, or test-cpp-main
  # fails CI.
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # JavaScript (Emscripten) build of the real spec's C++ library, tested with
  # the same fixture suite under Node. Same graceful-degradation shape as the
  # other *-main jobs.
  # ---------------------------------------------------------------------

  test-js-main:
    name: JavaScript target (specsheets/, C++ compiled with Emscripten)
    needs: regenerate
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace checked-out generated/ and fixtures/ with this run's fresh copies
        run: rm -rf "$MAIN_GEN_OUT" fixtures
      - uses: actions/download-artifact@v4
        with:
          name: main-generated
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Emscripten
        # Official emsdk, pinned by EMSCRIPTEN_VERSION above.
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Configure and build (emcmake; jsoncons and the ANTLR4 runtime are built for WebAssembly too)
        working-directory: ${{ github.workspace }}/generated/js
        env:
          # jsoncons' own CMakeLists still declares a pre-3.5 minimum, which
          # CMake 4 refuses without this; harmless on older CMake.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -l build/libsed2.js
      - name: Run fixture suite (Node)
        # test/fixtures.test.js is generator/emit_js.py's own copy of
        # templates/js/tests/fixtures.test.js - the JavaScript analog of
        # FixtureTest.cpp. It drives the built module through index.js.
        env:
          SED2_FIXTURES_DIR: ${{ github.workspace }}/fixtures
          LIBSED2_MODULE: ${{ github.workspace }}/generated/js/build/libsed2.js
        working-directory: ${{ github.workspace }}/generated/js
        run: node --test test/fixtures.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: js-module
          path: generated/js/build/libsed2.js
          retention-days: 7

  # ---------------------------------------------------------------------
  # Releases. Each release-* job needs the matching main-spec test job (so
  # nothing is packaged from a build whose fixture suite failed), builds the
  # distributable for its platform from this run's fresh generated/ tree,
  # smoke-tests that artifact (not the source tree), and uploads it. Runs on
  # every CI run. Nothing here creates or edits a GitHub release - download
  # the release-* artifacts from the run page and attach them by hand.
  # ---------------------------------------------------------------------

  release-python:
    name: Release - Python wheel
    needs: [regenerate, test-python-main]
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.regenerate.outputs.version }}
    steps:
      - uses: actions/setup-python@main
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@main
        with:
          name: main-generated
          path: .
      - name: Build the wheel
        # The library is pure Python (its ANTLR parser is generated .py
        # source, shipped via package-data), so this is one universal
        # py3-none-any wheel. No sdist: the wheel is the Python release.
        run: |
          pip install build
          python -m build --wheel --outdir dist generated/python
          ls -l dist
      - name: Check the wheel's name carries VERSION.txt's version
        run: |
          set -eu
          [ "$(ls dist | wc -l)" -eq 1 ] || { echo "::error::expected exactly one file in dist/"; exit 1; }
          [ -f "dist/libsed2-${VERSION}-py3-none-any.whl" ] || { echo "::error::expected dist/libsed2-${VERSION}-py3-none-any.whl"; ls dist; exit 1; }
      - name: Smoke-test the wheel in a clean virtualenv
        # Installs only the wheel (never the source tree), then, from an
        # unrelated directory, reports the installed version, loads every
        # pass fixture through the installed package and validates it. This
        # proves the wheel carries everything it needs at run time (the
        # ANTLR parser and handwritten rule modules in particular).
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install "dist/libsed2-${VERSION}-py3-none-any.whl"
          mkdir "$RUNNER_TEMP/neutral"
          cd "$RUNNER_TEMP/neutral"
          FIXTURES="${{ github.workspace }}/fixtures/handwritten" "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import glob, importlib.metadata, os, sys
          import libsed2

          expected = os.environ["VERSION"]
          installed = importlib.metadata.version("libsed2")
          assert installed == expected, f"installed {installed}, expected {expected}"
          assert "site-packages" in libsed2.__file__, libsed2.__file__

          paths = sorted(glob.glob(os.path.join(os.environ["FIXTURES"], "pass-*.sed2.json")))
          assert paths, "no pass-*.sed2.json fixtures found"
          bad = 0
          for p in paths:
              problems = libsed2.read_from_file(p).validate()
              print(os.path.basename(p), "->", len(problems), "problem(s)")
              bad += bool(problems)
          libsed2.parse_math("a + 2*b")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@main
        with:
          name: release-python
          path: dist/*.whl
          retention-days: 30

  release-java:
    name: Release - Java jar
    needs: [regenerate, test-java-main]
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.regenerate.outputs.version }}
    steps:
      - uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@main
        with:
          name: main-generated
          path: .
      - name: Build jar, sources jar and javadoc jar
        # The release profile (generated pom.xml) adds the -sources and
        # -javadoc jars. Tests already ran in test-java-main, which this job
        # needs, so they are skipped here.
        working-directory: ${{ github.workspace }}/generated/java
        run: mvn -B -Prelease package -DskipTests
      - name: Collect release files
        run: |
          set -eu
          mkdir dist
          for f in "libsed2j-${VERSION}.jar" "libsed2j-${VERSION}-sources.jar" "libsed2j-${VERSION}-javadoc.jar"; do
            [ -f "generated/java/target/$f" ] || { echo "::error::missing $f"; ls -l generated/java/target; exit 1; }
            cp "generated/java/target/$f" dist/
          done
          # The pom travels with the jar so a consumer's build tool can
          # resolve its dependencies.
          cp generated/java/pom.xml "dist/libsed2j-${VERSION}.pom"
          grep -q "<version>${VERSION}</version>" "dist/libsed2j-${VERSION}.pom"
          unzip -l "dist/libsed2j-${VERSION}.jar" | grep -q "org/sedml/libsed2/"
          ls -l dist
      - uses: actions/upload-artifact@main
        with:
          name: release-java
          path: dist/*
          retention-days: 30

  release-cpp:
    name: Release - C++ source package
    needs: [regenerate, test-cpp-main]
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.regenerate.outputs.version }}
    steps:
      # Checkout supplies LICENSE, VERSION.txt and the hand-written smoke
      # test under templates/cpp/release-smoke/.
      - uses: actions/checkout@main
      - name: Replace checked-out generated/ and fixtures/ with this run's fresh copies
        run: rm -rf "$MAIN_GEN_OUT" fixtures
      - uses: actions/download-artifact@main
        with:
          name: main-generated
          path: .
      - name: Assemble the package
        # The C++ library is header-only apart from the small ANTLR math
        # parser library, and fetches its dependencies (jsoncons, the ANTLR4
        # C++ runtime) with CMake FetchContent, so the release is the
        # self-contained CMake project, not prebuilt binaries: headers, the
        # few .cpp sources, CMakeLists.txt, LICENSE and VERSION.txt. No
        # tests/ - they need this repository's fixtures/.
        run: |
          set -eu
          name="libsed2-cpp-${VERSION}"
          mkdir -p "dist/$name"
          cp -r generated/cpp/CMakeLists.txt generated/cpp/include generated/cpp/src "dist/$name/"
          cp LICENSE VERSION.txt "dist/$name/"
          cat > "dist/$name/README.md" <<README
          # libsed2 (C++) ${VERSION}

          C++17 library for reading, writing and validating SED2 documents.
          Header-only apart from a small static library for its math parser.
          Requires CMake 3.16 or newer and network access at configure time:
          jsoncons and the ANTLR4 C++ runtime are fetched with FetchContent.

          Use it from another CMake project:

              add_subdirectory(libsed2-cpp-${VERSION})
              target_link_libraries(myapp PRIVATE libsed2::libsed2)

          and in code:

              #include <libsed2/Io.hpp>
              auto doc = libsed2::read_from_file("experiment.sed2.json");
              auto problems = doc->validate();

          The fixture test suite is only built when this directory is the
          top-level CMake project.
          README
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
          (cd dist && zip -qr "$name.zip" "$name")
          rm -rf "dist/$name"
          ls -l dist
      - name: Smoke-test the package as a CMake consumer
        # Extracts the .tar.gz and builds a tiny consumer project
        # (templates/cpp/release-smoke) that add_subdirectory()s it, checks
        # the declared version equals VERSION.txt, then validates every pass
        # fixture through the packaged library.
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/pkg"
          tar -C "$RUNNER_TEMP/pkg" -xzf "dist/libsed2-cpp-${VERSION}.tar.gz"
          cmake -S templates/cpp/release-smoke -B "$RUNNER_TEMP/smoke-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBSED2_DIR="$RUNNER_TEMP/pkg/libsed2-cpp-${VERSION}" \
            -DEXPECTED_VERSION="${VERSION}"
          cmake --build "$RUNNER_TEMP/smoke-build" -j"$(nproc)"
          set -- fixtures/handwritten/pass-*.sed2.json
          [ -e "$1" ] || { echo "::error::no pass-*.sed2.json fixtures found"; exit 1; }
          for f in "$@"; do "$RUNNER_TEMP/smoke-build/smoke" "$f"; done
      - uses: actions/upload-artifact@main
        with:
          name: release-cpp
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 30

  release-js:
    name: Release - JavaScript (npm tarball + single-file module)
    needs: [regenerate, test-js-main]
    if: needs.regenerate.outputs.regen_main_outcome == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.regenerate.outputs.version }}
    steps:
      # Checkout supplies LICENSE.
      - uses: actions/checkout@v4
      - name: Replace checked-out generated/ and fixtures/ with this run's fresh copies
        run: rm -rf "$MAIN_GEN_OUT" fixtures
      - uses: actions/download-artifact@v4
        with:
          name: main-generated
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: js-module
          path: js-module
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pack the npm tarball
        # The package is the generated wrapper (index.js, index.d.ts,
        # package.json, README.md) plus the module test-js-main built, which
        # is a single self-contained file (WebAssembly embedded). The
        # single-file module is also released on its own, like
        # libantimonyjs's libantimony.js, for use from a <script> tag.
        run: |
          set -eu
          mkdir stage dist
          cp generated/js/index.js generated/js/index.d.ts generated/js/package.json generated/js/README.md stage/
          cp js-module/libsed2.js LICENSE stage/
          (cd stage && npm pack --pack-destination ../dist)
          cp js-module/libsed2.js "dist/libsed2js-${VERSION}.js"
          [ -f "dist/libsed2js-${VERSION}.tgz" ] || { echo "::error::expected dist/libsed2js-${VERSION}.tgz"; ls dist; exit 1; }
          ls -l dist
      - name: Smoke-test the tarball in a clean project
        # Installs only the tarball, then, from there, reports the installed
        # version and validates every pass fixture through the package.
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --silent "${{ github.workspace }}/dist/libsed2js-${VERSION}.tgz"
          FIXTURES="${{ github.workspace }}/fixtures/handwritten" node - <<'JS'
          const fs = require('fs'), path = require('path');
          (async () => {
            const { load } = require('libsed2js');
            const sed2 = await load();
            if (sed2.version() !== process.env.VERSION) throw new Error(`version ${sed2.version()}, expected ${process.env.VERSION}`);
            const files = fs.readdirSync(process.env.FIXTURES).filter((f) => /^pass-.*\.sed2\.json$/.test(f)).sort();
            if (!files.length) throw new Error('no pass-*.sed2.json fixtures found');
            let bad = 0;
            for (const f of files) {
              const r = sed2.validate(fs.readFileSync(path.join(process.env.FIXTURES, f), 'utf8'));
              console.log(f, '->', r.ok ? r.problems.length + ' problem(s)' : 'ERROR ' + r.error);
              if (!r.ok || r.problems.length) bad++;
            }
            if (!sed2.checkMath('a + 2*b').ok) throw new Error('math check failed');
            process.exit(bad ? 1 : 0);
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: release-js
          path: dist/*
          retention-days: 30
